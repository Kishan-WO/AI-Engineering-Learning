[project]
name = "day-1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

# The scripts live in tasks/ and import each other. Python finds them because the script's own folder is on the
# import path; these settings tell the editor and the checkers the same thing.
[tool.pyright]
extraPaths = ["tasks"]

[tool.mypy]
mypy_path = "tasks"

[tool.ruff]
src = ["tasks"]
