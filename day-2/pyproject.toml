[project]
name = "day-2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

# The scripts live in tasks/ and import each other. Python finds them because the script's own folder is on the
# import path; these settings tell the editor and the checkers the same thing.
[tool.pyright]
extraPaths = ["tasks"]

[tool.mypy]
mypy_path = "tasks"

[tool.ruff]
src = ["tasks"]
