[project]
name = "docstore"
version = "0.1.0"
description = "A small typed document store with in-memory and JSON backends, a folder loader and a CLI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
docstore = "docstore.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docstore --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["docstore"]
branch = true

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
